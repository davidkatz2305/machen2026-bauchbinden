<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bauchbinden Heiligenstadt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --bg:#ffffff; --surface:#f3f8fb; --surface-2:#e6f3fa; --ink:#111417; --ink-2:#4a5966; --line:#d3e3ec;
  --blue:#0074B4; --blue-ink:#ffffff; --sky:#80CCEC; --sun:#FCCC00; --ok:#1d7a4a; --focus:#0074B4;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0d151c; --surface:#142029; --surface-2:#1a2b38; --ink:#eef4f8; --ink-2:#a9b8c4; --line:#27404f; --blue:#3a9ad8; --blue-ink:#07131b; --sky:#80CCEC; --sun:#FCCC00; --ok:#5fcf8f; --focus:#80CCEC; } }
:root[data-theme="dark"] {
  --bg:#0d151c; --surface:#142029; --surface-2:#1a2b38; --ink:#eef4f8; --ink-2:#a9b8c4; --line:#27404f; --blue:#3a9ad8; --blue-ink:#07131b; --sky:#80CCEC; --sun:#FCCC00; --ok:#5fcf8f; --focus:#80CCEC; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif; font-size:17px; line-height:1.5; padding-inline:16px; padding-block:0 64px; }
.wrap { max-width:880px; margin:0 auto; }
header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:22px 8px; border-bottom:3px solid var(--sun); }
header img { height:44px; width:auto; }
.logo-dark { display:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display:none; } :root:not([data-theme="light"]) .logo-dark { display:block; } }
:root[data-theme="dark"] .logo-light { display:none; } :root[data-theme="dark"] .logo-dark { display:block; }
header .tag { font-family:Sora, sans-serif; font-weight:600; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
h1 { font-family:Sora, sans-serif; font-weight:700; font-size:clamp(26px, 4vw, 36px); line-height:1.15; margin:28px 0 6px; text-wrap:balance; }
h1 small { display:block; font-weight:500; font-size:.55em; color:var(--blue); letter-spacing:.02em; margin-bottom:6px; }
h2 { font-family:Sora, sans-serif; font-weight:600; font-size:20px; margin:36px 0 10px; }
p { max-width:66ch; margin:0 0 12px; }
.lead { font-size:19px; color:var(--ink-2); }
figure { margin:20px 0 0; background:var(--surface); border-radius:14px; padding:12px; }
figure img { width:100%; height:auto; border-radius:8px; display:block; }
figcaption { font-size:15px; color:var(--ink-2); margin-top:10px; }
figcaption b { color:var(--ink); }
.person { display:grid; grid-template-columns:168px 1fr; gap:18px; background:var(--surface); border-radius:14px; padding:16px; margin-top:16px; align-items:start; }
.person img { width:168px; aspect-ratio:4/5; object-fit:cover; border-radius:10px; display:block; background:#000; }
.thumb { position:relative; }
.num { position:absolute; left:-8px; top:-8px; width:36px; height:36px; border-radius:50%; background:var(--sun); color:#111; font-family:Sora, sans-serif; font-weight:700; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
label { display:block; font-weight:600; font-size:15px; margin-bottom:4px; }
label span { font-weight:400; color:var(--ink-2); }
input, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
input:focus, textarea:focus { outline:3px solid color-mix(in srgb, var(--focus) 35%, transparent); border-color:var(--focus); }
.fields { display:grid; gap:12px; }
.meta { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
.actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:24px; }
button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:12px 20px; cursor:pointer; }
.primary { background:var(--blue); color:var(--blue-ink); }
.primary:hover { filter:brightness(1.08); }
.ghost { background:var(--surface-2); color:var(--ink); }
button:focus-visible, a:focus-visible { outline:3px solid var(--sun); outline-offset:2px; }
.note { font-size:15px; color:var(--ink-2); }
.status { margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--surface-2); display:none; }
.status.show { display:block; }
pre.mailtext { white-space:pre-wrap; background:var(--surface); border-radius:10px; padding:12px; font-size:15px; display:none; }
pre.mailtext.show { display:block; }
.index { display:grid; gap:10px; margin-top:16px; }
.index a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; background:var(--surface); color:var(--ink); text-decoration:none; font-weight:600; }
.index a .cnt { font-weight:400; color:var(--ink-2); font-size:15px; font-variant-numeric:tabular-nums; }
.index a:hover { background:var(--surface-2); }
.empty { background:var(--surface); border-radius:14px; padding:20px; margin-top:20px; }
.val { font-size:20px; font-weight:600; padding:8px 0; border-bottom:1px solid var(--line); user-select:all; }
footer { margin-top:48px; font-size:14px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:14px; }
@media (max-width:560px) { .person { grid-template-columns:1fr; } .person img { width:100%; max-width:260px; } .meta { grid-template-columns:1fr; } header img { height:36px; } }
@media (prefers-reduced-motion: no-preference) { .primary { transition:filter .15s ease; } }
</style>

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function slug() { return decodeURIComponent(location.hash.replace(/^#\/?/, "")); }
function renderIndex() {
  document.title = "machen!2026 Bauchbinden";
  app.innerHTML = `<h1>Bauchbinden für die machen!2026-Filme</h1>
  <p class="lead">Übersicht der Projektseiten. Jede Seite hat einen eigenen Link, der an den Ansprechpartner des Projekts geht.</p>
  <div class="index">${DATA.projects.map(p => `<a href="#${p.slug}"><span>${esc(p.ort)}${p.titel ? " · " + esc(p.titel) : ""}</span><span class="cnt">${p.shots.length ? p.shots.length + " Personen" : "Screenshots folgen"}</span></a>`).join("")}</div>`;
}
function key(p) { return "bauchbinden-" + p.slug; }
function load(p) { try { return JSON.parse(localStorage.getItem(key(p)) || "{}"); } catch (e) { return {}; } }
function save(p, v) { try { localStorage.setItem(key(p), JSON.stringify(v)); } catch (e) {} }
function renderResult(p, r) {
  const name = p.ort + (p.titel ? " – " + p.titel : "");
  document.title = "Bauchbinden " + p.ort + " – Übersicht";
  app.innerHTML = `<h1><small>machen!2026 · ${esc(p.ort)}</small>Eingesendete Bauchbinden</h1>
  <p class="lead">${esc(name)} · eingesendet von ${esc(r.ap || "–")}${r.m ? " · " + esc(r.m) : ""}</p>
  ${p.shots.map((src, i) => `<div class="person"><div class="thumb"><span class="num">${i + 1}</span><img src="${src}" alt="Person ${i + 1}"></div>
    <div class="fields"><div><label>Name</label><div class="val">${esc((r.e[i] || [])[0] || "–")}</div></div><div><label>Rolle</label><div class="val">${esc((r.e[i] || [])[1] || "–")}</div></div></div></div>`).join("")}
  ${r.n ? `<h2>Anmerkungen</h2><p>${esc(r.n)}</p>` : ""}`;
}
function renderProject(p) {
  const name = p.ort + (p.titel ? " – " + p.titel : "");
  document.title = "Bauchbinden " + p.ort;
  const d = load(p);
  if (!p.shots.length) {
    app.innerHTML = `<h1><small>machen!2026 · ${esc(p.ort)}</small>${esc(name)}</h1><div class="empty">Für dieses Projekt liegen noch keine Screenshots vor. Die Seite wird ergänzt, sobald die Interviews geschnitten sind.</div>`; return;
  }
  app.innerHTML = `
  <h1><small>machen!2026 · ${esc(p.ort)}</small>Wer ist wer im Film?</h1>
  <p class="lead">Für ${esc(name)} brauchen wir für jede interviewte Person den Namen und die Rolle, so wie sie im Film eingeblendet werden sollen.</p>
  <figure><img src="${EXAMPLE}" alt="Beispiel einer Bauchbinde im Film"><figcaption>So sieht die Bauchbinde später im Film aus: <b>Name</b> in der oberen Zeile, <b>Funktion oder Organisation</b> in der unteren.</figcaption></figure>
  <h2>Personen im Interview</h2>
  <form id="f" novalidate>
  ${p.shots.map((src, i) => `<div class="person">
    <div class="thumb"><span class="num">${i + 1}</span><img src="${src}" alt="Person ${i + 1}"></div>
    <div class="fields">
      <div><label for="n${i}">Name <span>(Vor- und Nachname, so wie er eingeblendet werden soll)</span></label><input id="n${i}" name="n${i}" autocomplete="off" value="${esc(d["n" + i] || "")}"></div>
      <div><label for="r${i}">Rolle <span>(Funktion und/oder Organisation, z. B. „Mitgründerin Kulturkombinatoren")</span></label><input id="r${i}" name="r${i}" autocomplete="off" value="${esc(d["r" + i] || "")}"></div>
    </div></div>`).join("")}
  <h2>Ihre Kontaktdaten</h2>
  <div class="meta">
    <div><label for="ap">Ihr Name</label><input id="ap" name="ap" value="${esc(d.ap || "")}"></div>
    <div><label for="mail">Ihre E-Mail <span>(für Rückfragen)</span></label><input id="mail" name="mail" type="email" value="${esc(d.mail || "")}"></div>
  </div>
  <div style="margin-top:12px"><label for="notes">Anmerkungen <span>(optional, z. B. Schreibweisen, Titel, Personen ohne Bauchbinde)</span></label><textarea id="notes" name="notes" rows="3">${esc(d.notes || "")}</textarea></div>
  <div class="actions">
    <button type="submit" class="primary">Absenden</button>

  </div>

  <pre class="mailtext" id="mailtext"></pre>
  </form>`;
  const f = document.getElementById("f");
  const collect = () => { const v = {}; new FormData(f).forEach((val, k) => v[k] = val.trim()); return v; };

  const text = () => {
    const v = collect();
    const lines = [`Bauchbinden – ${name}`, ""];

    lines.push("", `Ansprechpartner: ${v.ap || "-"} · ${v.mail || "-"}`);
    if (v.notes) lines.push("", "Anmerkungen:", v.notes);
    lines.push("", "Die Nummern beziehen sich auf die Screenshots auf der Projektseite: " + (DATA.projects.length === 1 ? location.href.split("#")[0] : location.href));

  };
  const status = document.getElementById("status");

    const fields = { _subject: "Bauchbinden " + name, _template: "table", _captcha: "false", Projekt: name };
    const base = location.href.split("#")[0].replace(/[^/]*$/, "");
    p.shots.forEach((_, i) => { fields["Person " + (i + 1)] = (v["n" + i] || "") + " – " + (v["r" + i] || "") + "  |  Bild: " + base + "p" + (i + 1) + ".jpg"; });
    const result = { e: p.shots.map((_, i) => [v["n" + i] || "", v["r" + i] || ""]), ap: v.ap || "", m: v.mail || "", n: v.notes || "" };
    const enc = btoa(unescape(encodeURIComponent(JSON.stringify(result)))).replace(/[+]/g, "-").replace(/[/]/g, "_").replace(/=+$/, "");
    fields["Uebersicht mit Bildern"] = base + "#r=" + enc;
    fields["Ansprechpartner"] = v.ap || "-"; fields["E-Mail"] = v.mail || "-"; fields["Anmerkungen"] = v.notes || "-"; fields["Seite"] = location.href.split("#")[0];
    if (v.mail) fields._replyto = v.mail;
    let ok = false, notActivated = false;
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + (DATA.relay || DATA.mail), { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(fields) });
      const j = await r.json().catch(() => ({})); ok = r.ok && String(j.success) === "true";
      if (!ok && /activat/i.test(String(j.message || ""))) { notActivated = true; }
    } catch (err) { ok = false; }
    if (ok) {
      status.innerHTML = "<b>Gesendet, vielen Dank!</b> Die Angaben sind bei " + esc(DATA.mail) + " eingegangen.";
      btn.textContent = "Gesendet"; try { localStorage.removeItem(key(p)); } catch (e) {}
    } else {
      btn.disabled = false; btn.textContent = "Absenden";
      status.innerHTML = notActivated
        ? "Der Versand ist noch nicht freigeschaltet (FormSubmit-Aktivierung steht aus). Bitte den Text unten kopieren und an <b>" + esc(DATA.mail) + "</b> mailen, oder es später noch einmal versuchen."
        : "Das Senden hat gerade nicht geklappt. Bitte noch einmal versuchen oder den Text unten kopieren und an <b>" + esc(DATA.mail) + "</b> mailen.";
      const pre = document.getElementById("mailtext"); pre.textContent = body; pre.classList.add("show");
    }
    status.classList.add("show");
  });
  document.getElementById("copy").addEventListener("click", async () => {
    const body = text(); const pre = document.getElementById("mailtext"); pre.textContent = body; pre.classList.add("show");
    try { await navigator.clipboard.writeText(body); status.textContent = "Text kopiert. Bitte an " + DATA.mail + " senden."; }
    catch (e) { status.textContent = "Text steht unten zum Markieren und Kopieren bereit."; }
    status.classList.add("show");
  });
}
function route() {
  const m = location.hash.match(/^#r=([A-Za-z0-9_-]+)/);
  if (m && DATA.projects.length === 1) {
    try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); renderResult(DATA.projects[0], j); return; } catch (e) {}
  }
  if (DATA.projects.length === 1) { renderProject(DATA.projects[0]); return; } const s = slug(); const p = DATA.projects.find(x => x.slug === s); if (p) renderProject(p); else renderIndex(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route); route();
</script>
